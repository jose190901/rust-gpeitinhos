[package]
name = "rustgpeitinhos"
version = "0.1.0"
edition = "2024"
description = "Cliente independente em Rust para o Codex App Server"
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_commonmark = { version = "0.26.0", default-features = false }
rfd = "0.18.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
strip = true
